# Fixed source: six-platform validation run 42689917970, attempt 1.
# One-time temporary branch only; remove this file after successful publication.
name: Publish verified bgo 4.1.0 once
on:
  push:
    branches: [release/bgo-4.1.0]
    paths: [.github/workflows/publish-bgo-4.1.0-once.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: bgo-manual-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'kira1928/biliLive-tools' && github.ref == 'refs/heads/release/bgo-4.1.0' && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse unfinished release plan before checkout
        shell: python
        run: |
          import re
          assert re.fullmatch('[0-9a-f]{40}', '18bed1e24d2b45840390c6d7a7830f20c7f88d8f') and re.fullmatch('[0-9a-f]{40}', 'fb21f32ad73aa408cb07300c147ee8229d684139') and 42689917970 > 0 and 1 > 0, 'Fixed source pending final six-green validation'
      - uses: actions/checkout@v4
        with:
          ref: '18bed1e24d2b45840390c6d7a7830f20c7f88d8f'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed source and publish six committed bundles
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          """One-time fixed-source bundle publisher; frozen values identify the verified six-platform run."""
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          
          REPO = 'kira1928/biliLive-tools'
          SHA = '18bed1e24d2b45840390c6d7a7830f20c7f88d8f'
          TREE = 'fb21f32ad73aa408cb07300c147ee8229d684139'
          RUN = 42689917970
          ATTEMPT = 1
          TAG = '4.1.0-bgo.1'
          BRANCH = 'release/bgo-4.1.0'
          BUILD_BRANCH = 'upgrade/bgo-4.1.0'
          SOURCE_BRANCH = 'for-bgo'
          PLATFORMS = ('ubuntu-x64', 'ubuntu-armv7', 'ubuntu-arm64', 'macos-x64', 'macos-arm64', 'windows-x64')
          JOBS = {'build (' + p.replace('-', ', ', 1) + ')' for p in PLATFORMS}
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def frozen():
              require(re.fullmatch('[0-9a-f]{40}', SHA) and re.fullmatch('[0-9a-f]{40}', TREE)
                      and type(RUN) is int and RUN > 0 and type(ATTEMPT) is int and ATTEMPT > 0,
                      'STOP: fixed release source is pending final six-platform success')
          
          
          def invocation():
              frozen()
              require(os.environ.get('GITHUB_REPOSITORY') == REPO and
                      os.environ.get('GITHUB_EVENT_NAME') == 'push' and
                      os.environ.get('GITHUB_REF') == 'refs/heads/' + BRANCH and
                      os.environ.get('GITHUB_RUN_ATTEMPT') == '1', 'Wrong publishing invocation or rerun')
              require(os.environ.get('GITHUB_WORKFLOW_REF') ==
                      REPO + '/.github/workflows/publish-bgo-4.1.0-once.yml@refs/heads/' + BRANCH,
                      'Wrong publishing workflow identity')
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as handle:
                  event = json.load(handle)
              require(event['repository']['full_name'] == REPO and not event.get('deleted') and
                      event['ref'] == 'refs/heads/' + BRANCH and
                      event['after'] == os.environ['GITHUB_SHA'] and
                      re.fullmatch('[0-9a-f]{40}', event['after']), 'Wrong push identity')
          
          
          def load_helper():
              # Verify checkout before executing any repository Python code.
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
              require(head == SHA and tree == TREE, 'Checkout does not match fixed source')
              spec = importlib.util.spec_from_file_location('bgo_release', Path('scripts/bgo_release.py'))
              helper = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = helper
              spec.loader.exec_module(helper)
              require(helper.REPOSITORY == REPO and tuple(helper.PLATFORMS) == PLATFORMS and
                      helper.WORKFLOW == '.github/workflows/for-bgo.yml', 'Unexpected helper contract')
              return helper
          
          
          def validate_source(helper, ctx):
              frozen()
              require((ctx.repo, ctx.sha, ctx.run, ctx.attempt, ctx.ref, ctx.tag) ==
                      (REPO, SHA, RUN, ATTEMPT, 'refs/heads/' + BUILD_BRANCH, TAG), 'Context changed')
              head = helper.api('/git/ref/heads/' + SOURCE_BRANCH)['object']
              require(head['type'] == 'commit' and head['sha'] == SHA, 'for-bgo head changed')
              publish_head = helper.api('/git/ref/heads/' + BRANCH)['object']
              require(publish_head['type'] == 'commit' and publish_head['sha'] == os.environ['GITHUB_SHA'],
                      'Temporary publishing branch changed')
              require(helper.api('/git/commits/' + SHA)['tree']['sha'] == TREE, 'Source tree changed')
              run = helper.api('/actions/runs/' + str(RUN))
              require(run['id'] == RUN and run['repository']['full_name'] == REPO and
                      run['head_repository']['full_name'] == REPO and run['head_sha'] == SHA and
                      run['head_branch'] == BUILD_BRANCH and run['event'] == 'push' and
                      run['path'] == '.github/workflows/for-bgo.yml' and run['run_attempt'] == ATTEMPT and
                      run['status'] == 'completed' and run['conclusion'] == 'success', 'Source run changed or not successful')
              latest = {}
              for attempt in range(1, ATTEMPT + 1):
                  jobs = helper.pages(f'/actions/runs/{RUN}/attempts/{attempt}/jobs', 'jobs')
                  require(jobs, 'Missing attempt jobs')
                  seen = set()
                  for job in jobs:
                      name = job['name']
                      require(name not in seen, 'Duplicate job name')
                      seen.add(name)
                      require(job['run_id'] == RUN and job['head_sha'] == SHA and
                              job.get('run_attempt', attempt) == attempt and job['status'] == 'completed',
                              'Job identity/status mismatch')
                      if name in JOBS:
                          latest[name] = job
                      else:
                          require(name in ('validate-release', 'publish') and job['conclusion'] == 'skipped',
                                  'Unexpected job or non-build execution')
              require(set(latest) == JOBS and all(j['conclusion'] == 'success' for j in latest.values()),
                      'Latest six build results must succeed')
          
          
          def main():
              invocation()
              helper = load_helper()
              ctx = helper.Context(REPO, SHA, RUN, ATTEMPT, 'refs/heads/' + BUILD_BRANCH, TAG, TAG)
              validator = lambda c: validate_source(helper, c)
              try:
                  validator(ctx)
                  helper.ensure_absent(ctx)
                  with tempfile.TemporaryDirectory() as directory:
                      # Six bgo-release-* artifacts contain untouched consumer ZIPs plus
                      # manifests. Helper verifies outer digest, provenance/tree/attempt,
                      # inner ZIP hash/size and safe root entries; no rebuilding/repacking.
                      assets = helper.fetch_artifacts(ctx, directory)
                      final = helper.publish(ctx, assets, validate_source=validator)
                  summary = f"Published [{TAG}]({final['html_url']}) at `{SHA}` with six verified bundle assets.\n"
              except Exception:
                  summary = ('Publication stopped. Do not retry or clean up automatically. Inspect the tag, draft, '
                             'assets and run first; an uncertain response may mean publication succeeded.\n')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
                      handle.write(summary)
                  raise
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
                  handle.write(summary)
          
          
          if __name__ == '__main__':
              main()
