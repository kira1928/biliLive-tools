name: Build/CLI

on:
  push:
    branches:
      - upgrade/bgo-4.1.0
  workflow_dispatch:
    inputs:
      is_release:
        description: "是否发布 Release（六个平台构建成功后一次性发布；不允许覆盖已有 tag）"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "发布时使用的 tag 名（is_release=true 时必填，例如 v3.1.2）"
        required: false
        type: string
        default: ""
      release_name:
        description: "Release 名称（可选，不填则默认等于 tag）"
        required: false
        type: string
        default: ""

jobs:
  validate-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.is_release == true }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manual inputs and reject existing release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bgo_release.py validate

  build:
    name: build (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [validate-release]
    if: ${{ !cancelled() && (needs.validate-release.result == 'success' || needs.validate-release.result == 'skipped') }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    env: {}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: x64
            runs-on: ubuntu-22.04
          - os: ubuntu
            arch: armv7
            runs-on: ubuntu-22.04
          - os: ubuntu
            arch: arm64
            runs-on: ubuntu-22.04-arm
          - os: macos
            arch: x64
            runs-on: macos-15-intel
          - os: macos
            arch: arm64
            runs-on: macos-15
          - os: windows
            arch: x64
            runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node + pnpm (composite)
        uses: ./.github/actions/cli-setup

      - name: Build CLI (composite)
        if: ${{ matrix.arch != 'armv7' }}
        uses: ./.github/actions/cli-build

      - name: Build CLI in Ubuntu armv7 (emulated)
        if: ${{ matrix.arch == 'armv7' }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu22.04
          shell: /bin/bash
          install: |
            set -euxo pipefail
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates curl git tar xz-utils build-essential python3 pkg-config \
              libfontconfig1-dev libfreetype6-dev libcairo2-dev libpango1.0-dev libharfbuzz-dev \
              libjpeg-dev libpng-dev librsvg2-dev
          run: |
            set -euxo pipefail
            NODE_VER=$(tr -d 'v\r\n' < .node-version)
            ARCH=linux-armv7l
            curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-${ARCH}.tar.xz" -o /tmp/node.tar.xz
            mkdir -p /usr/local/lib/nodejs
            tar -xJf /tmp/node.tar.xz -C /usr/local/lib/nodejs
            ln -sf "/usr/local/lib/nodejs/node-v${NODE_VER}-${ARCH}/bin/node" /usr/local/bin/node
            ln -sf "/usr/local/lib/nodejs/node-v${NODE_VER}-${ARCH}/bin/npm" /usr/local/bin/npm
            ln -sf "/usr/local/lib/nodejs/node-v${NODE_VER}-${ARCH}/bin/npx" /usr/local/bin/npx
            ln -sf "/usr/local/lib/nodejs/node-v${NODE_VER}-${ARCH}/bin/corepack" /usr/local/bin/corepack || true
            node -v
            export PATH="/usr/local/lib/nodejs/node-v${NODE_VER}-${ARCH}/bin:$PATH"
            # Install the exact pnpm version declared by the workspace.
            PM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
            npm install --global "pnpm@$PM_VERSION"
            node -v
            pnpm -v
            pnpm -F "bililive-cli"... install --frozen-lockfile --prefer-offline
            # better-sqlite3 13 ships N-API prebuilds except for linux-arm.
            SQLITE_DIR=$(node -p "require('node:fs').realpathSync('packages/CLI/node_modules/better-sqlite3')")
            npm exec --yes --package=node-gyp@11.4.2 -- node-gyp rebuild --directory "$SQLITE_DIR"
            node --test packages/CLI/test/copy_module.test.js
            pnpm -F "bililive-cli"... build
            pnpm -F "bililive-cli" movePackage
            node scripts/check-cli-package.js

      - name: Setup archive tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test release safety helpers
        run: python -m unittest discover -s scripts -p test_bgo_release.py -v

      - name: Package archive and provenance
        env:
          PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
        run: python scripts/bgo_release.py pack --platform "$PLATFORM"
        shell: bash

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: bgo-release-${{ matrix.os }}-${{ matrix.arch }}
          path: release-bundle/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    needs: [validate-release, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.is_release == true && needs.validate-release.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    concurrency:
      group: bgo-manual-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify six bundles and publish a complete new draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bgo_release.py publish

permissions:
  contents: read
