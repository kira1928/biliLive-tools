name: CLI Setup
description: Install the pinned Node and pnpm versions with a dependency cache.
runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version

    - name: Install pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        run_install: false

    - name: Enable pnpm cache
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Print runtime versions
      shell: bash
      run: |
        node -p "process.version + ' ' + process.platform + ' ' + process.arch"
        pnpm --version
